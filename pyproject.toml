[project]
name = "jarvis-gateway"
version = "2.0.0a1"
description = "Local AI orchestration gateway: intent routing, RAG, task decomposition and guardrails across a Mac mini and a MacBook Pro."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Gauttam Suraneni" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "requests>=2.32",
  "neo4j>=5.20",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "psutil>=6.0",
  "langgraph>=0.2",
  "watchdog>=4.0",
  "litellm[proxy]>=1.50",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.uv]
package = true

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
