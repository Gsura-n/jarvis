# LiteLLM proxy config. Secrets are pulled from the environment (loaded from ~/.jarvis.env by scripts/start.sh).
# Deployment names are <tier>-<device>; the gateway's policy engine picks among them (see jarvis.yaml).

model_list:
  # ── Mac mini (small tier) ──────────────────────────────────────────────
  - model_name: classifier
    litellm_params:
      model: ollama/llama3.2:3b
      api_base: http://localhost:11434

  - model_name: general
    litellm_params:
      model: ollama/llama3.1:8b
      api_base: http://localhost:11434

  - model_name: coding
    litellm_params:
      model: ollama/qwen2.5-coder:7b
      api_base: http://localhost:11434

  - model_name: reasoning
    litellm_params:
      model: ollama/deepseek-r1:8b
      api_base: http://localhost:11434

  # ── MacBook Pro (large tier) — wired into routing in week 3 ────────────
  - model_name: large-mbp
    litellm_params:
      model: ollama/qwen3:30b-a3b-instruct-2507-q4_K_M
      api_base: http://10.0.0.47:11434

router_settings:
  routing_strategy: simple-shuffle

litellm_settings:
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  ui_access_mode: all
  disable_spend_logs: true
