# Golden Rules gates for every pull request. Rule IDs refer to RULES.md in golden-rules.
# Actions are pinned to commit SHAs (SUP-005); Dependabot proposes bumps.
name: golden-gates

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: golden-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    # PR size (REV-002), test weakening (TST-002), agent and CI config changes (AGT-003),
    # hidden Unicode in instruction files (AGT-004)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Golden Rules PR checks
        env:
          GOLDEN_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/golden/check_pr.py all --base "origin/${BASE_REF}"


  sast:
    # SEC-001 to SEC-005, SEC-007: fail only on findings new in this PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Semgrep
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          pip install --quiet semgrep==1.178.0
          if [ -n "$BASE_SHA" ]; then
            semgrep scan --config p/default --metrics=off --error --baseline-commit "$BASE_SHA"
          else
            semgrep scan --config p/default --metrics=off --error
          fi

  dependencies:
    # SUP-001, SUP-002, SEC-007: known vulnerabilities in locked dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Audit dependencies
        run: |
          set -e
          ran=0
          if [ -f uv.lock ]; then
            pip install --quiet uv pip-audit==2.10.1
            uv export --frozen --no-hashes --all-groups --no-emit-project -o /tmp/requirements.txt
            pip-audit -r /tmp/requirements.txt
            ran=1
          elif ls requirements*.txt >/dev/null 2>&1; then
            pip install --quiet pip-audit==2.10.1
            for f in requirements*.txt; do pip-audit -r "$f"; done
            ran=1
          elif [ -f pyproject.toml ]; then
            echo "::warning::No Python lockfile found. Pin dependencies in a committed lockfile (SUP-002)."
            python -m venv /tmp/audit && . /tmp/audit/bin/activate
            pip install --quiet . pip-audit==2.10.1
            pip-audit --skip-editable
            ran=1
          fi
          if [ -f package-lock.json ]; then
            npm audit --audit-level=high --omit=dev
            ran=1
          fi
          [ "$ran" = 1 ] || echo "No supported manifest found; skipping."
